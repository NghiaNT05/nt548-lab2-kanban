apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kanban-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NghiaNT05/nt548-lab2-kanban.git
    targetRevision: develop
    path: k8s/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kanban-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
