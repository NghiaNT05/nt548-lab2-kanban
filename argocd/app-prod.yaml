apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kanban-prod
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/NghiaNT05/nt548-lab2-kanban.git
    targetRevision: main
    path: k8s/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kanban-prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
