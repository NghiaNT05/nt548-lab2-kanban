name: Release (prod)

# Chay khi gan tag vX.Y.Z tren main:
#   1. build image gan version + push GHCR
#   2. tao GitHub Release kem changelog
#   3. CHO DUYET (environment production) roi cap nhat overlay prod -> ArgoCD deploy
on:
  push:
    tags:
      - "v*"

env:
  IMAGE_PREFIX: ghcr.io/nghiant05

permissions:
  contents: read

jobs:
  build-release:
    name: Build image release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - frontend
          - task-service
          - stats-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build va push image theo version
        run: |
          docker build \
            -t $IMAGE_PREFIX/kanban-${{ matrix.service }}:${GITHUB_REF_NAME} \
            -t $IMAGE_PREFIX/kanban-${{ matrix.service }}:stable \
            ${{ matrix.service }}
          docker push $IMAGE_PREFIX/kanban-${{ matrix.service }}:${GITHUB_REF_NAME}
          docker push $IMAGE_PREFIX/kanban-${{ matrix.service }}:stable

  github-release:
    name: Tao GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tao Release kem changelog tu dong
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          name: Kanban ${{ github.ref_name }}
          body: |
            Image phat hanh tren GHCR (tag `${{ github.ref_name }}`):
            - `${{ env.IMAGE_PREFIX }}/kanban-frontend:${{ github.ref_name }}`
            - `${{ env.IMAGE_PREFIX }}/kanban-task-service:${{ github.ref_name }}`
            - `${{ env.IMAGE_PREFIX }}/kanban-stats-service:${{ github.ref_name }}`

  deploy-prod:
    name: Deploy prod (cho duyet)
    needs: build-release
    runs-on: ubuntu-latest
    # Environment 'production' co required reviewer -> job dung cho ban bam Approve
    environment: production
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cap nhat overlay prod sang version vua phat hanh
        run: |
          sed -i "s/newTag: .*/newTag: ${GITHUB_REF_NAME}/" k8s/overlays/prod/kustomization.yaml
          git diff

      - name: Commit va push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml
          git commit -m "Release ${GITHUB_REF_NAME} to prod [skip ci]"
          git push origin main
