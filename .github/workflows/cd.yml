name: CD

# Chay khi merge/push vao develop (->dev) hoac main (->prod).
# Build + push image len GHCR, roi cap nhat overlay tuong ung de ArgoCD tu sync.
on:
  push:
    branches:
      - develop
      - main

env:
  IMAGE_PREFIX: ghcr.io/nghiant05

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_ci-checks.yml
    secrets: inherit

  # Xac dinh moi truong tu nhanh
  setup:
    name: Xac dinh moi truong
    needs: checks
    runs-on: ubuntu-latest
    outputs:
      env: ${{ steps.env.outputs.env }}
      overlay: ${{ steps.env.outputs.overlay }}
      tag: ${{ steps.env.outputs.tag }}
    steps:
      - id: env
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "env=prod"   >> "$GITHUB_OUTPUT"
            echo "overlay=k8s/overlays/prod" >> "$GITHUB_OUTPUT"
            echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "env=dev"     >> "$GITHUB_OUTPUT"
            echo "overlay=k8s/overlays/dev" >> "$GITHUB_OUTPUT"
            echo "tag=dev-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          fi

  build-push:
    name: Build va push images
    needs: setup
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - frontend
          - task-service
          - stats-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t $IMAGE_PREFIX/kanban-${{ matrix.service }}:${{ needs.setup.outputs.tag }} \
            ${{ matrix.service }}

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/kanban-${{ matrix.service }}:${{ needs.setup.outputs.tag }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Push image
        run: docker push $IMAGE_PREFIX/kanban-${{ matrix.service }}:${{ needs.setup.outputs.tag }}

  update-manifests:
    name: Cap nhat manifests cho ArgoCD
    needs:
      - setup
      - build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Cap nhat image tag trong overlay
        run: |
          sed -i "s/newTag: .*/newTag: ${{ needs.setup.outputs.tag }}/" \
            ${{ needs.setup.outputs.overlay }}/kustomization.yaml
          git diff

      - name: Commit va push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ needs.setup.outputs.overlay }}/kustomization.yaml
          git commit -m "Deploy ${{ needs.setup.outputs.tag }} to ${{ needs.setup.outputs.env }} [skip ci]"
          git push origin ${{ github.ref_name }}
