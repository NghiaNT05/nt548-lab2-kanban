name: CD (dev)

# Chay khi merge/push vao develop -> deploy moi truong dev (kanban-dev).
# Prod KHONG deploy o day; prod chi deploy qua release.yml khi gan tag vX.Y.Z.
on:
  push:
    branches:
      - develop

env:
  IMAGE_PREFIX: ghcr.io/nghiant05

permissions:
  contents: read

jobs:
  checks:
    uses: ./.github/workflows/_ci-checks.yml
    secrets: inherit

  build-push:
    name: Build va push images (dev)
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service:
          - frontend
          - task-service
          - stats-service
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        run: |
          docker build \
            -t $IMAGE_PREFIX/kanban-${{ matrix.service }}:dev-${GITHUB_SHA} \
            ${{ matrix.service }}

      - name: Trivy scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/kanban-${{ matrix.service }}:dev-${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Push image
        run: docker push $IMAGE_PREFIX/kanban-${{ matrix.service }}:dev-${GITHUB_SHA}

  update-manifests:
    name: Cap nhat overlay dev cho ArgoCD
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Cap nhat image tag trong overlay dev
        run: |
          sed -i "s/newTag: .*/newTag: dev-${GITHUB_SHA}/" k8s/overlays/dev/kustomization.yaml
          git diff

      - name: Commit va push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/dev/kustomization.yaml
          git commit -m "Deploy dev-${GITHUB_SHA} to dev [skip ci]"
          git push origin develop
