apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kanban-prod

resources:
  - namespace.yaml
  - ../../base

patches:
  - path: patch-prod.yaml

# CD (merge vao main) cap nhat newTag theo commit SHA / release version
images:
  - name: ghcr.io/nghiant05/kanban-frontend
    newTag: stable
  - name: ghcr.io/nghiant05/kanban-task-service
    newTag: stable
  - name: ghcr.io/nghiant05/kanban-stats-service
    newTag: stable
