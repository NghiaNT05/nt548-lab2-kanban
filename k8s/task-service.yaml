apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-service
  namespace: kanban
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-service
  template:
    metadata:
      labels:
        app: task-service
    spec:
      # Tat bien moi truong service-link (REDIS_PORT=tcp://...) de khong de len config cua app
      enableServiceLinks: false
      containers:
        - name: task-service
          image: ghcr.io/nghiant05/kanban-task-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: REDIS_HOST
              value: redis
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: task-service
  namespace: kanban
spec:
  selector:
    app: task-service
  ports:
    - port: 5000
      targetPort: 5000
